services:
  mysql:
    image: mysql:8
    container_name: todolist-mysql
    restart: unless-stopped
    ports:
      - '3306:3306'
    environment:
      # Root sem senha (igual ao DB_PASSWORD vazio do backend/.env)
      MYSQL_ALLOW_EMPTY_PASSWORD: '1'
      MYSQL_DATABASE: todolist
    volumes:
      - mysql-data:/var/lib/mysql
      # O schema.sql é aplicado automaticamente na primeira criação do container
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql-data:
